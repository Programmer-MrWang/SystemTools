name: M5 native builds and package aggregation

on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform]
  pull_request:
    branches: [codex/cross-platform]

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert actual build architecture
        shell: bash
        run: python -c "import sys; sys.path.insert(0, 'eng'); import m1; assert m1.native_rid() == '${{ matrix.rid }}'"
      - name: Native clean restore and build
        run: python eng/m1.py build --clean
      - name: Shared and M5 regression without desktop mutation
        run: python eng/m5.py check
      - name: Verify same-OS reproducible paths
        if: runner.os != 'Linux'
        run: python eng/check_reproducible.py
      # CI builds and pure contracts do not assert real X11, TCC or USB device acceptance.
      - name: Stage M5 native outputs and private dependencies
        run: python eng/m5.py stage --target ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: m5-stage-${{ matrix.rid }}
          path: artifacts/m5/stages/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-checks-${{ matrix.rid }}
          path: |
            artifacts/m5/*.json
            artifacts/m5/*.log
            artifacts/m3/*.log
            artifacts/m1/reproducibility-failure/**
          if-no-files-found: ignore

  aggregate:
    needs: native-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-stage-*
          path: artifacts/m5/downloads
      - name: Require matching source, SDK, shared binaries and native provenance
        run: >-
          python eng/m5.py aggregate
          --input artifacts/m5/downloads/m5-stage-win-x64
          artifacts/m5/downloads/m5-stage-linux-x64
          artifacts/m5/downloads/m5-stage-osx-arm64
          --output artifacts/m5/SystemTools.M5.Native.cipx
      - uses: actions/upload-artifact@v4
        with:
          name: SystemTools-M5-native-build-aggregate
          path: |
            artifacts/m5/SystemTools.M5.Native.cipx
            artifacts/m5/SystemTools.M5.Native.cipx.sha256
            artifacts/m5/aggregate-native/m2-package.json
          if-no-files-found: error
