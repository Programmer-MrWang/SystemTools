name: M2 native checks and Windows preview

on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform]
  pull_request:
    branches: [codex/cross-platform]

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert actual build architecture
        shell: bash
        run: python -c "import sys; sys.path.insert(0, 'eng'); import m1; assert m1.native_rid() == '${{ matrix.rid }}'"
      - name: Native clean restore and build
        run: python eng/m1.py build --clean
      - name: Package boundary tests
        run: |
          python eng/test_m1_packaging.py
          python eng/test_m2_packaging.py
      - name: Verify same-OS reproducible paths
        if: runner.os != 'Linux'
        run: python eng/check_reproducible.py
      - name: Guard host accessibility regression
        if: runner.os == 'macOS'
        run: dotnet run --project tests/SystemTools.HostCompatibility.Tests -c Release
      - name: Managed loader checks
        if: runner.os != 'Linux'
        run: python eng/m1.py test
      # Linux M1 is build-only at the user's request; there is no desktop/X11 runtime claim.
      - name: Build self-contained Windows speech worker
        if: runner.os == 'Windows'
        run: dotnet build VoskWorker/SystemTools.VoskWorker.csproj -c Release --nologo
      - name: Stage and package Windows preview against SDK contracts
        if: runner.os == 'Windows'
        run: |
          python eng/m2.py stage
          python eng/m2.py package
      - uses: actions/upload-artifact@v4
        with:
          name: m2-build-${{ matrix.rid }}
          path: artifacts/m1/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SystemTools-M2-Windows-build-only-preview
          path: |
            artifacts/m2/SystemTools.M2.cipx
            artifacts/m2/SystemTools.M2.cipx.sha256
          if-no-files-found: error
