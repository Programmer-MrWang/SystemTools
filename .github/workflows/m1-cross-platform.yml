name: M8 native candidate builds and package aggregation

on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform]
  pull_request:
    branches: [codex/cross-platform]

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode with the macOS 26 glass SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Assert actual build architecture
        shell: bash
        run: python -c "import sys; sys.path.insert(0, 'eng'); import m1; assert m1.native_rid() == '${{ matrix.rid }}'"
      - name: Native clean restore and build
        run: python eng/m1.py build --clean
      - name: Shared and M8 regression without desktop mutation
        run: python eng/m8.py check
      - name: Exercise real Linux Secret Service in an isolated user bus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
          dbus-run-session -- bash -c 'printf "" | gnome-keyring-daemon --unlock --components=secrets; dotnet run --project tests/SystemTools.M8.Tests -c Release -- --native-credentials'
      - name: Verify same-OS reproducible paths
        if: runner.os != 'Linux'
        run: python eng/check_reproducible.py
      # CI builds and pure contracts do not assert real X11, TCC or USB device acceptance.
      - name: Stage M8 native outputs and private dependencies
        run: python eng/m8.py stage --target ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: m8-stage-${{ matrix.rid }}
          path: artifacts/m8/stages/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-checks-${{ matrix.rid }}
          path: |
            artifacts/m8/*.json
            artifacts/m8/*.log
            artifacts/m7/*.json
            artifacts/m7/*.log
            artifacts/m3/*.log
            artifacts/m1/reproducibility-failure/**
          if-no-files-found: ignore

  aggregate:
    needs: native-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: m8-stage-*
          path: artifacts/m8/downloads
      - name: Require matching source, SDK, shared binaries and native provenance
        run: >-
          python eng/m8.py aggregate
          --input artifacts/m8/downloads/m8-stage-win-x64
          artifacts/m8/downloads/m8-stage-linux-x64
          artifacts/m8/downloads/m8-stage-osx-arm64
          --output artifacts/m8/SystemTools.M8.Native.cipx
      - uses: actions/upload-artifact@v4
        with:
          name: SystemTools-M8-native-build-aggregate
          path: |
            artifacts/m8/SystemTools.M8.Native.cipx
            artifacts/m8/SystemTools.M8.Native.cipx.sha256
            artifacts/m8/aggregate-native/m2-package.json
          if-no-files-found: error
